[project]
name = "onboarding-interview"
version = "0.1.0"
description = "Local app for semi-autonomous candidate interviews and screening"
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk>=0.2.167",
    "fastapi",
    "pydantic>=2",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest",
    "ruff",
    "ty",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
